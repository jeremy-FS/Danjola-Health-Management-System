{% extends "base.html" %}
{% block title %}Manage Inventory{% endblock %}
{% block body %}
<div class="container mt-4">
    <h2>Inventory Management</h2>
    <table class="table table-bordered">
        <thead>
            <tr><th>Name</th><th>Type</th><th>Stock</th><th>Price ($)</th><th>Actions</th></tr>
        </thead>
        <tbody>
            {% for drug in drugs %}
            <tr>
                <td>{{ drug.name }}</td>
                <td>{{ drug.category }}</td>
                <td>{{ drug.stock }}</td>
                <td>{{ drug.price }}</td>
                <td>
                    <form action="{{ url_for('update_stock', id=drug.id) }}" method="POST" class="d-inline">
                        <input type="number" name="new_stock" placeholder="New Stock" required>
                        <button type="submit" class="btn btn-success btn-sm">Update</button>
                    </form>
                    <form action="{{ url_for('delete_medication', id=drug.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h3>Add New Medication</h3>
    <form method="POST">
        <input type="text" name="name" placeholder="Medication Name" class="form-control" required>
        <input type="text" name="category" placeholder="Category" class="form-control mt-2" required>
        <input type="number" name="price" placeholder="Price" class="form-control mt-2" required>
        <input type="number" name="stock" placeholder="Stock Quantity" class="form-control mt-2" required>
        <button type="submit" class="btn btn-primary mt-3">Add Medication</button>
    </form>
</div>
{% endblock %}
